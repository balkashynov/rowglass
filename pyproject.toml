[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rowglass"
version = "0.1.0"
description = "A replication flight recorder and debugger for Postgres to ClickHouse"
requires-python = ">=3.11"
dependencies = ["psycopg2-binary==2.9.11"]

[project.scripts]
rowglass = "rowglass.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
