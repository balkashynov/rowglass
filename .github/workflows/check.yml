name: Evidence and core checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install -e . ruff==0.15.6
      - run: cargo fmt --all --check && cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked && cargo build --release --locked
      - run: ruff check python tests lab scripts
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/verify_evidence.py
      - run: python scripts/package.py
